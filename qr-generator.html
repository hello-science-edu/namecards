<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Công Cụ Tạo Mã QR – Hello Science Edu</title>
  <meta name="description" content="Công cụ tạo mã QR tĩnh vĩnh viễn và lấy mã Base64 cho danh thiếp điện tử Hello Science Edu.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Montserrat:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <!-- QRCode.js lightweight library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --navy: #040443;
      --navy-dark: #02022b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --green: #10b981;
      --page: #e9eaf0;
      --card: #ffffff;
      --border: rgba(4, 4, 67, 0.1);
      --muted: #64748b;
      --f-display: "Plus Jakarta Sans", "Montserrat", sans-serif;
      --f-body: "DM Sans", "Montserrat", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--page);
      font-family: var(--f-body);
      color: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(20px, 4vw, 48px) 16px;
    }

    .container {
      width: 100%;
      max-width: 840px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      text-align: center;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--f-display);
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(4, 4, 67, 0.05);
    }

    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    }

    h1 {
      font-family: var(--f-display);
      font-size: clamp(1.6rem, 3.5vw, 2.3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .lead {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card-panel {
      background: var(--card);
      border-radius: 20px;
      padding: clamp(24px, 4vw, 36px);
      box-shadow: 0 16px 36px rgba(4, 4, 67, 0.08);
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 32px;
    }

    @media (max-width: 768px) {
      .card-panel {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    label {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--navy);
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-family: var(--f-body);
      font-size: 0.95rem;
      color: #0f172a;
      transition: all 0.2s ease;
      background: #f8fafc;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--navy);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(4, 4, 67, 0.1);
    }

    .options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .quick-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .preset-btn {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 12px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      color: #334155;
      transition: all 0.15s ease;
    }

    .preset-btn:hover {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    /* Right Preview Column */
    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }

    .qr-frame {
      width: 220px;
      height: 220px;
      background: #ffffff;
      border-radius: 12px;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px rgba(4, 4, 67, 0.08);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      padding: 10px;
    }

    .qr-frame img, .qr-frame canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .badge-static {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--green);
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 3px 10px;
      border-radius: 999px;
    }

    /* Action buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      font-family: var(--f-display);
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--navy);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(4, 4, 67, 0.15);
    }

    .btn-primary:hover {
      background: #1e1b85;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--navy);
      border: 1px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      background: #0f172a;
      color: #fff;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-pill">
        <span class="dot"></span>
        Hello Science Edu
      </div>
      <h1>Bộ Tạo Mã QR Vĩnh Viễn</h1>
      <p class="lead">Tạo mã QR tĩnh chuẩn nét cao và xuất mã Base64 cho danh thiếp điện tử.</p>
    </header>

    <div class="card-panel">
      <!-- Input Section -->
      <div>
        <div class="form-group">
          <label for="urlInput">Đường link cần tạo QR (URL):</label>
          <input type="text" id="urlInput" placeholder="https://www.linkedin.com/in/..." value="https://www.linkedin.com/in/">
          <div class="quick-presets">
            <button class="preset-btn" type="button" onclick="setPreset('https://www.linkedin.com/in/grace-soyun-jung-58aa2b184/')">Cô Grace</button>
            <button class="preset-btn" type="button" onclick="setPreset('https://www.linkedin.com/in/kien-dao-693017136/')">Anh Kenny</button>
            <button class="preset-btn" type="button" onclick="setPreset('https://www.linkedin.com/in/ngoc-tran-866492426/')">Chị Ruby</button>
            <button class="preset-btn" type="button" onclick="setPreset('https://www.helloscienceedu.com/')">Website HSE</button>
          </div>
        </div>

        <div class="options-row">
          <div class="form-group">
            <label for="sizeSelect">Độ phân giải ảnh:</label>
            <select id="sizeSelect">
              <option value="500">500 x 500 px (Tiêu chuẩn)</option>
              <option value="1000" selected>1000 x 1000 px (HD - Danh thiếp)</option>
              <option value="2000">2000 x 2000 px (Ultra HD - In ấn)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="marginSelect">Viền lề (Margin):</label>
            <select id="marginSelect">
              <option value="1" selected>Gọn nhẹ (1 ô)</option>
              <option value="2">Vừa phải (2 ô)</option>
              <option value="4">Rộng chuẩn (4 ô)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="base64Preview">Mã Base64 nhúng HTML (tự động cập nhật):</label>
          <input type="text" id="base64Preview" readonly onclick="this.select()">
        </div>
      </div>

      <!-- Preview Section -->
      <div class="preview-box">
        <div class="qr-frame" id="qrContainer"></div>
        <span class="badge-static">✔ QR Tĩnh • Vĩnh Viễn 100%</span>

        <div class="btn-group">
          <button class="btn btn-primary" type="button" onclick="downloadQR()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Tải ảnh PNG (qr.png)
          </button>
          <button class="btn btn-secondary" type="button" onclick="copyBase64()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy mã Base64
          </button>
          <a class="btn btn-secondary" id="testLink" href="#" target="_blank" rel="noopener">
            Kiểm tra đường link ↗
          </a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Đã copy mã Base64 vào bộ nhớ tạm!</div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const sizeSelect = document.getElementById('sizeSelect');
    const marginSelect = document.getElementById('marginSelect');
    const qrContainer = document.getElementById('qrContainer');
    const base64Preview = document.getElementById('base64Preview');
    const testLink = document.getElementById('testLink');
    const toast = document.getElementById('toast');

    let currentBase64 = '';

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function setPreset(url) {
      urlInput.value = url;
      updateQR();
    }

    function updateQR() {
      const url = urlInput.value.trim();
      testLink.href = url || '#';
      if (!url) {
        qrContainer.innerHTML = '<span style="color:#94a3b8;font-size:0.85rem">Nhập URL để xem mã</span>';
        base64Preview.value = '';
        currentBase64 = '';
        return;
      }

      const size = parseInt(sizeSelect.value, 10) || 1000;
      const margin = parseInt(marginSelect.value, 10) || 1;

      // Use QR API for high-resolution static generation
      const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&margin=${margin}&format=png&data=${encodeURIComponent(url)}`;

      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.onload = function() {
        qrContainer.innerHTML = '';
        const previewImg = document.createElement('img');
        previewImg.src = img.src;
        previewImg.alt = 'QR Code';
        qrContainer.appendChild(previewImg);

        // Convert to canvas to get full resolution Base64
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        currentBase64 = canvas.toDataURL('image/png');
        base64Preview.value = currentBase64;
      };

      img.onerror = function() {
        // Fallback to local qrcode.js if offline
        qrContainer.innerHTML = '';
        try {
          new QRCode(qrContainer, {
            text: url,
            width: 200,
            height: 200,
            correctLevel: QRCode.CorrectLevel.M
          });
          setTimeout(() => {
            const canvas = qrContainer.querySelector('canvas');
            if (canvas) {
              currentBase64 = canvas.toDataURL('image/png');
              base64Preview.value = currentBase64;
            }
          }, 100);
        } catch (e) {
          qrContainer.innerHTML = '<span style="color:red">Lỗi tạo QR</span>';
        }
      };

      img.src = apiUrl;
    }

    function downloadQR() {
      if (!currentBase64) return;
      const a = document.createElement('a');
      a.href = currentBase64;
      a.download = 'qr.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('Đã tải xuống file ảnh qr.png!');
    }

    function copyBase64() {
      if (!currentBase64) return;
      navigator.clipboard.writeText(currentBase64).then(() => {
        showToast('Đã copy chuỗi Base64 Data URI!');
      }).catch(() => {
        base64Preview.select();
        document.execCommand('copy');
        showToast('Đã copy chuỗi Base64!');
      });
    }

    urlInput.addEventListener('input', updateQR);
    sizeSelect.addEventListener('change', updateQR);
    marginSelect.addEventListener('change', updateQR);

    // Initial render
    updateQR();
  </script>
</body>
</html>
