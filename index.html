<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Science Edu – Digital Business Card</title>
  <meta name="description" content="Digital business card of Hello Science Edu Company Limited">

  <!-- Open Graph / Facebook / Zalo / Teams / Slack Preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hello-science-edu.github.io/namecards/">
  <meta property="og:title" content="Hello Science Edu – Digital Business Card">
  <meta property="og:description" content="Digital business card of Hello Science Edu Company Limited">
  <meta property="og:image" content="https://hello-science-edu.github.io/namecards/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="685">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hello Science Edu – Digital Business Card">
  <meta name="twitter:description" content="Digital business card of Hello Science Edu Company Limited">
  <meta name="twitter:image" content="https://hello-science-edu.github.io/namecards/preview.png">

  <!-- Automatically redirecting to Grace's business card -->
  <meta http-equiv="refresh" content="0; url=./grace/">
  <link rel="canonical" href="./grace/">
  <script>
    window.location.replace("./grace/");
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e9eaf0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #040443;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(4, 4, 67, 0.12);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(4, 4, 67, 0.15);
      border-top-color: #040443;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #000;
    }
    p {
      font-size: 0.92rem;
      color: #555;
      margin-bottom: 16px;
    }
    a {
      display: inline-block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #040443;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid rgba(4, 4, 67, 0.2);
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    a:hover {
      background: #040443;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>HELLO SCIENCE EDU</h1>
    <p>Redirecting to business card...</p>
    <a href="./grace/">Click here if you are not redirected automatically</a>
  </div>
</body>
</html>
